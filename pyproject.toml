[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emporio-agent"
version = "0.1.0"
description = "Customer service agent for Empório da Música (Artefact AI Engineer challenge)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Eduardo Zelaya" }]
dependencies = [
    "openai>=1.40",
    "pydantic>=2.7",
    "pandas>=2.2",
    "pypdf>=4.2",
    "rich>=13.7",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    # Windows has no system IANA tz database; zoneinfo needs this to resolve
    # America/Campo_Grande. No-op on Linux/macOS.
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "ruff>=0.5"]

[project.scripts]
emporio = "emporio.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
